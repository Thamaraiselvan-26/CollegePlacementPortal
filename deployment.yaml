apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-placement
spec:
  replicas: 3

  selector:
    matchLabels:
      app: college-placement

  template:
    metadata:
      labels:
        app: college-placement

    spec:
      containers:
      - name: college-placement
        image: thamaraiselvan26/college-placement-portal:latest

        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: college-placement-service

spec:
  type: NodePort

  selector:
    app: college-placement

  ports:
  - port: 80
    targetPort: 80
    nodePort: 30012
